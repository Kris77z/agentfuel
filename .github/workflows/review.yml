name: Review checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run review:check
